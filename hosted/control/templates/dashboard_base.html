{% extends "base.html" %}

{% block body %}
<!-- GitBook-style dark dashboard layout -->
<div class="flex h-screen" x-data="{ sidebarOpen: false }">
    <!-- Mobile sidebar backdrop -->
    <div x-show="sidebarOpen"
         x-cloak
         @click="sidebarOpen = false"
         x-transition:enter="transition-opacity ease-linear duration-150"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 lg:hidden">
    </div>

    <!-- Sidebar -->
    <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
           class="fixed inset-y-0 left-0 z-50 w-56 bg-dark-900 border-r border-dark-800 transform transition-transform duration-200 ease-in-out lg:translate-x-0 lg:static lg:inset-auto flex flex-col">

        <!-- Logo & User -->
        <div class="flex items-center gap-2 px-4 h-12 border-b border-dark-800">
            <div x-data="{ open: false }" class="relative flex-1">
                <button @click="open = !open"
                        @click.away="open = false"
                        class="flex items-center gap-1.5 text-dark-200 hover:text-dark-50 transition-colors">
                    <span class="text-sm font-medium">{{ user.username }}</span>
                    <svg class="w-3.5 h-3.5 text-dark-500 transition-transform" :class="open && 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>

                <!-- User dropdown -->
                <div x-show="open"
                     x-cloak
                     x-transition:enter="transition ease-out duration-100"
                     x-transition:enter-start="opacity-0 scale-95"
                     x-transition:enter-end="opacity-100 scale-100"
                     x-transition:leave="transition ease-in duration-75"
                     x-transition:leave-start="opacity-100 scale-100"
                     x-transition:leave-end="opacity-0 scale-95"
                     class="absolute top-full left-0 mt-1 w-48 bg-dark-850 rounded-md border border-dark-700 py-1 z-50">
                    <a href="/dashboard/settings" class="flex items-center gap-2 px-3 py-1.5 text-sm text-dark-300 hover:bg-dark-800 hover:text-dark-100">
                        <svg class="w-4 h-4 text-dark-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 011.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.56.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 01-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 01-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.107-1.204l-.527-.738a1.125 1.125 0 01.12-1.45l.773-.773a1.125 1.125 0 011.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        Settings
                    </a>
                    <div class="border-t border-dark-700 my-1"></div>
                    <form action="/logout" method="POST">
                        <button type="submit" class="w-full flex items-center gap-2 px-3 py-1.5 text-sm text-dark-300 hover:bg-dark-800 hover:text-dark-100">
                            <svg class="w-4 h-4 text-dark-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/>
                            </svg>
                            Sign out
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-2 py-3 overflow-y-auto">
            <div class="space-y-0.5">
                <a href="/dashboard"
                   class="group flex items-center gap-2.5 px-2.5 py-1.5 rounded text-sm transition-colors
                          {% if active_page == 'home' %}
                          text-primary-500 font-medium
                          {% else %}
                          text-dark-400 hover:text-dark-200 hover:bg-dark-850
                          {% endif %}">
                    <svg class="w-4 h-4 {% if active_page == 'home' %}text-primary-500{% else %}text-dark-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Home
                </a>

                <a href="/dashboard/grants"
                   class="group flex items-center gap-2.5 px-2.5 py-1.5 rounded text-sm transition-colors
                          {% if active_page == 'grants' %}
                          text-primary-500 font-medium
                          {% else %}
                          text-dark-400 hover:text-dark-200 hover:bg-dark-850
                          {% endif %}">
                    <svg class="w-4 h-4 {% if active_page == 'grants' %}text-primary-500{% else %}text-dark-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                    </svg>
                    Connections
                </a>

                <a href="/dashboard/audit"
                   class="group flex items-center gap-2.5 px-2.5 py-1.5 rounded text-sm transition-colors
                          {% if active_page == 'audit' %}
                          text-primary-500 font-medium
                          {% else %}
                          text-dark-400 hover:text-dark-200 hover:bg-dark-850
                          {% endif %}">
                    <svg class="w-4 h-4 {% if active_page == 'audit' %}text-primary-500{% else %}text-dark-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/>
                    </svg>
                    Activity
                </a>

                <a href="/dashboard/tokens"
                   class="group flex items-center gap-2.5 px-2.5 py-1.5 rounded text-sm transition-colors
                          {% if active_page == 'tokens' %}
                          text-primary-500 font-medium
                          {% else %}
                          text-dark-400 hover:text-dark-200 hover:bg-dark-850
                          {% endif %}">
                    <svg class="w-4 h-4 {% if active_page == 'tokens' %}text-primary-500{% else %}text-dark-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/>
                    </svg>
                    API Tokens
                </a>
            </div>

            <!-- Resources -->
            <div class="border-t border-dark-800 my-3"></div>
            <div class="space-y-0.5">
                <span class="px-2.5 py-1 text-xs font-medium text-dark-600 uppercase tracking-wide">Resources</span>
                <a href="/docs"
                   class="group flex items-center gap-2.5 px-2.5 py-1.5 rounded text-sm transition-colors
                          {% if active_page == 'docs' %}
                          text-primary-500 font-medium
                          {% else %}
                          text-dark-400 hover:text-dark-200 hover:bg-dark-850
                          {% endif %}">
                    <svg class="w-4 h-4 {% if active_page == 'docs' %}text-primary-500{% else %}text-dark-500{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    Documentation
                </a>
                <a href="https://github.com/milesgoscha/personalcontextprotocol"
                   target="_blank"
                   class="group flex items-center gap-2.5 px-2.5 py-1.5 rounded text-sm text-dark-400 hover:text-dark-200 hover:bg-dark-850 transition-colors">
                    <svg class="w-4 h-4 text-dark-500" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    GitHub
                </a>
            </div>
        </nav>

        <!-- Footer -->
        <div class="px-4 py-3 border-t border-dark-800">
            <img src="/static/img/pcp-logo.svg" alt="PCP" class="w-4 h-4 opacity-50">
        </div>
    </aside>

    <!-- Main content area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Mobile header -->
        <header class="lg:hidden bg-dark-900 border-b border-dark-800 px-4 h-12 flex items-center gap-3">
            <button @click="sidebarOpen = true" class="p-1.5 -ml-1.5 rounded hover:bg-dark-800 text-dark-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <div class="flex items-center gap-1">
                <img src="/static/img/pcp-logo.svg" alt="PCP" class="w-5 h-5">
                <span class="font-medium text-dark-200 text-sm">PCP</span>
            </div>
        </header>

        <!-- Page content -->
        <main class="flex-1 overflow-y-auto bg-dark-950">
            {% block page_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
