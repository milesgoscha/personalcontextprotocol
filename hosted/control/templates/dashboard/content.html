{% extends "dashboard_base.html" %}

{% block title %}Your Data - PCP{% endblock %}

{% block page_content %}
<div class="px-8 lg:px-12 py-8 max-w-4xl">
    <!-- Page header -->
    <header class="mb-8 animate-fade-in">
        <h1 class="text-2xl font-semibold text-dark-100">Your Data</h1>
        <p class="mt-1.5 text-dark-400">Browse events, learnings, and reflections stored in your node</p>
    </header>

    <!-- Type Filter Tabs -->
    <div class="flex gap-2 mb-6 border-b border-dark-800 pb-4" x-data="{ activeType: 'all' }">
        <button @click="activeType = 'all'"
                hx-get="/api/v1/node/content?type=all"
                hx-target="#content-list"
                hx-swap="innerHTML"
                :class="activeType === 'all' ? 'bg-primary-500/20 text-primary-400 border-primary-500/30' : 'text-dark-400 hover:bg-dark-800 border-dark-700'"
                class="px-3 py-1.5 text-sm rounded-md border transition-colors">
            All
        </button>
        <button @click="activeType = 'event'"
                hx-get="/api/v1/node/content?type=event"
                hx-target="#content-list"
                hx-swap="innerHTML"
                :class="activeType === 'event' ? 'bg-blue-500/20 text-blue-400 border-blue-500/30' : 'text-dark-400 hover:bg-dark-800 border-dark-700'"
                class="px-3 py-1.5 text-sm rounded-md border transition-colors">
            Events
        </button>
        <button @click="activeType = 'learning'"
                hx-get="/api/v1/node/content?type=learning"
                hx-target="#content-list"
                hx-swap="innerHTML"
                :class="activeType === 'learning' ? 'bg-purple-500/20 text-purple-400 border-purple-500/30' : 'text-dark-400 hover:bg-dark-800 border-dark-700'"
                class="px-3 py-1.5 text-sm rounded-md border transition-colors">
            Learnings
        </button>
        <button @click="activeType = 'reflection'"
                hx-get="/api/v1/node/content?type=reflection"
                hx-target="#content-list"
                hx-swap="innerHTML"
                :class="activeType === 'reflection' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'text-dark-400 hover:bg-dark-800 border-dark-700'"
                class="px-3 py-1.5 text-sm rounded-md border transition-colors">
            Reflections
        </button>
    </div>

    <!-- Content List (loaded via HTMX) -->
    <div id="content-list"
         hx-get="/api/v1/node/content?type=all"
         hx-trigger="load"
         hx-swap="innerHTML"
         class="animate-slide-up">
        <div class="text-center py-12 text-dark-500">
            <svg class="animate-spin h-6 w-6 mx-auto mb-3 text-primary-500" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-sm">Loading your data...</p>
        </div>
    </div>
</div>
{% endblock %}
