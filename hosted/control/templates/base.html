<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PCP{% endblock %}</title>

    <!-- Fonts: IBM Plex family for that refined technical documentation feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['IBM Plex Sans', 'system-ui', 'sans-serif'],
                        mono: ['IBM Plex Mono', 'monospace'],
                    },
                    colors: {
                        // Sophisticated teal accent - inspired by modern dev tools
                        accent: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        },
                        // Refined grays with slight warmth
                        surface: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                        }
                    },
                    fontSize: {
                        'xs': ['0.75rem', { lineHeight: '1.5' }],
                        'sm': ['0.875rem', { lineHeight: '1.5715' }],
                        'base': ['1rem', { lineHeight: '1.75' }],
                        'lg': ['1.125rem', { lineHeight: '1.75' }],
                        'xl': ['1.25rem', { lineHeight: '1.75' }],
                        '2xl': ['1.5rem', { lineHeight: '1.415' }],
                        '3xl': ['1.875rem', { lineHeight: '1.333' }],
                    },
                    boxShadow: {
                        'soft': '0 1px 2px 0 rgb(0 0 0 / 0.03), 0 1px 6px -1px rgb(0 0 0 / 0.02)',
                        'card': '0 1px 3px 0 rgb(0 0 0 / 0.04), 0 1px 2px -1px rgb(0 0 0 / 0.02)',
                        'elevated': '0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.03)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'slide-in': 'slideIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideIn: {
                            '0%': { opacity: '0', transform: 'translateX(-10px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }

        /* Smooth page transitions */
        .htmx-swapping { opacity: 0; transition: opacity 0.15s ease-out; }

        /* Progress indicator */
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-indicator { opacity: 0; transition: opacity 0.2s ease; }

        /* Loading bar */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            width: 0;
            background: linear-gradient(90deg, #14b8a6, #2dd4bf);
            z-index: 9999;
            transition: width 0.3s ease;
        }
        .htmx-request #progress-bar { width: 90%; }

        /* Button loading states */
        button.htmx-request { opacity: 0.7; pointer-events: none; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }

        /* Code blocks */
        code:not(pre code) {
            background: #f4f4f5;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.875em;
            color: #0f766e;
        }

        /* Focus styles */
        *:focus-visible {
            outline: 2px solid #14b8a6;
            outline-offset: 2px;
        }

        /* Staggered animation delays for lists */
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; }
        .stagger-4 { animation-delay: 0.2s; }
        .stagger-5 { animation-delay: 0.25s; }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="h-full bg-surface-50 text-surface-900 antialiased">
    <!-- Progress bar -->
    <div id="progress-bar"></div>

    {% block body %}
    <div class="min-h-full">
        {% block nav %}{% endblock %}

        <main>
            {% block content %}{% endblock %}
        </main>

        {% block footer %}{% endblock %}
    </div>
    {% endblock %}

    <!-- Toast notifications -->
    <div id="toast-container"
         class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"
         x-data="{ toasts: [] }"
         @notify.window="toasts.push({message: $event.detail.message, type: $event.detail.type || 'info', id: Date.now()}); setTimeout(() => toasts.shift(), 5000)">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="true"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 translate-y-2 scale-95"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 :class="{
                     'bg-emerald-600': toast.type === 'success',
                     'bg-rose-600': toast.type === 'error',
                     'bg-surface-800': toast.type === 'info',
                     'bg-amber-500': toast.type === 'warning'
                 }"
                 class="px-4 py-3 rounded-lg text-white text-sm font-medium shadow-elevated flex items-center gap-2">
                <template x-if="toast.type === 'success'">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                </template>
                <template x-if="toast.type === 'error'">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </template>
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
