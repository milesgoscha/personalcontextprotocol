<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PCP{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/img/pcp-logo.svg">

    <!-- Fonts: Inter for clean UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    },
                    colors: {
                        // GitBook-style orange accent
                        primary: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f26b3a',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                        },
                        // Dark theme grays
                        dark: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            300: '#d1d5db',
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            850: '#1a1d24',
                            900: '#111318',
                            950: '#0d0f12',
                        }
                    },
                    fontSize: {
                        'xs': ['0.75rem', { lineHeight: '1.5' }],
                        'sm': ['0.8125rem', { lineHeight: '1.5' }],
                        'base': ['0.875rem', { lineHeight: '1.6' }],
                        'lg': ['1rem', { lineHeight: '1.5' }],
                        'xl': ['1.125rem', { lineHeight: '1.4' }],
                        '2xl': ['1.25rem', { lineHeight: '1.3' }],
                        '3xl': ['1.5rem', { lineHeight: '1.25' }],
                    },
                    borderRadius: {
                        'sm': '0.25rem',
                        'DEFAULT': '0.375rem',
                        'md': '0.5rem',
                        'lg': '0.625rem',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'slide-up': 'slideUp 0.25s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }

        /* Smooth transitions */
        .htmx-swapping { opacity: 0; transition: opacity 0.1s ease-out; }

        /* Progress indicator */
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-indicator { opacity: 0; transition: opacity 0.15s ease; }

        /* Loading bar - orange accent */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            width: 0;
            background: #f26b3a;
            z-index: 9999;
            transition: width 0.2s ease;
        }
        .htmx-request #progress-bar { width: 90%; }

        /* Button loading states */
        button.htmx-request { opacity: 0.7; pointer-events: none; }

        /* Scrollbar - dark theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

        /* Code blocks - dark */
        code:not(pre code) {
            background: #1a1d24;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.85em;
            color: #f3f4f6;
            border: 1px solid #374151;
        }

        /* Focus styles */
        *:focus-visible {
            outline: 2px solid #f26b3a;
            outline-offset: 2px;
        }

        /* Selection */
        ::selection {
            background: #f26b3a;
            color: white;
        }

        /* Input autofill dark mode */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #f3f4f6;
            -webkit-box-shadow: 0 0 0px 1000px #1a1d24 inset;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="h-full bg-dark-950 text-dark-200 antialiased">
    <!-- Progress bar -->
    <div id="progress-bar"></div>

    {% block body %}
    <div class="min-h-full">
        {% block nav %}{% endblock %}

        <main>
            {% block content %}{% endblock %}
        </main>

        {% block footer %}{% endblock %}
    </div>
    {% endblock %}

    <!-- Toast notifications - dark style -->
    <div id="toast-container"
         class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"
         x-data="{ toasts: [] }"
         @notify.window="toasts.push({message: $event.detail.message, type: $event.detail.type || 'info', id: Date.now()}); setTimeout(() => toasts.shift(), 4000)">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="true"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-y-2"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 :class="{
                     'bg-dark-800 text-dark-100 border border-dark-700': toast.type === 'success' || toast.type === 'info',
                     'bg-red-900/80 text-red-100 border border-red-800': toast.type === 'error',
                     'bg-amber-900/80 text-amber-100 border border-amber-800': toast.type === 'warning'
                 }"
                 class="px-4 py-2.5 rounded-md text-sm font-medium flex items-center gap-2">
                <template x-if="toast.type === 'success'">
                    <svg class="w-4 h-4 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                </template>
                <template x-if="toast.type === 'error'">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </template>
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
