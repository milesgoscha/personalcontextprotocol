{% extends "base.html" %}

{% block title %}Sign In - PCP{% endblock %}

{% block body %}
<div class="min-h-full flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8 bg-dark-950">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <img src="/static/img/pcp-logo.svg" alt="PCP" class="w-12 h-12">
        </div>

        <h1 class="text-center text-xl font-semibold text-dark-100">
            Sign in to PCP
        </h1>
        <p class="mt-2 text-center text-sm text-dark-400">
            Or
            <a href="/signup" class="font-medium text-primary-500 hover:text-primary-400">create a new account</a>
        </p>
    </div>

    <div class="mt-6 sm:mx-auto sm:w-full sm:max-w-sm">
        <div class="bg-dark-900 py-6 px-5 border border-dark-800 rounded-lg">
            {% if error %}
            <div class="mb-4 rounded-md border border-red-800/50 bg-red-900/30 p-3">
                <div class="flex gap-2">
                    <svg class="h-4 w-4 text-red-400 mt-0.5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
                    </svg>
                    <p class="text-sm text-red-300">{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <form class="space-y-4" action="/login" method="POST" hx-boost="false"
                  x-data="{
                      email: '{{ email or '' }}',
                      password: '',
                      submitting: false,
                      get emailValid() { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.email) },
                      get formValid() { return this.emailValid && this.password.length > 0 }
                  }"
                  @submit="submitting = true">

                <div>
                    <label for="email" class="block text-sm font-medium text-dark-300 mb-1.5">Email address</label>
                    <input id="email"
                           name="email"
                           type="email"
                           autocomplete="email"
                           required
                           x-model="email"
                           class="block w-full rounded-md border border-dark-700 bg-dark-850 px-3 py-2 text-sm text-dark-100 placeholder-dark-500 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 transition-colors">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-dark-300 mb-1.5">Password</label>
                    <input id="password"
                           name="password"
                           type="password"
                           autocomplete="current-password"
                           required
                           x-model="password"
                           class="block w-full rounded-md border border-dark-700 bg-dark-850 px-3 py-2 text-sm text-dark-100 placeholder-dark-500 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 transition-colors">
                </div>

                <div class="pt-1">
                    <button type="submit"
                            :disabled="!formValid || submitting"
                            :class="formValid && !submitting ? 'bg-primary-500 hover:bg-primary-600' : 'bg-dark-700 cursor-not-allowed'"
                            class="flex w-full justify-center rounded-md py-2 px-4 text-sm font-medium text-white transition-colors">
                        <span x-show="!submitting">Sign in</span>
                        <span x-show="submitting" x-cloak class="flex items-center">
                            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Signing in...
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
