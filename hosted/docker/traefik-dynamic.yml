# Traefik dynamic configuration for PCP Multi-Tenant Mode

http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin

    rate-limit-auth:
      rateLimit:
        average: 10
        burst: 20
        period: 1m

  routers:
    control-plane:
      rule: "Host(`pcp.bio`)"
      service: control-plane
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: pcp.bio
            sans:
              - "*.pcp.bio"
      middlewares:
        - security-headers
      priority: 100

    subdomain-proxy:
      rule: "HostRegexp(`^[a-z0-9-]+\\.pcp\\.bio$`)"
      service: control-plane
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
        domains:
          - main: pcp.bio
            sans:
              - "*.pcp.bio"
      middlewares:
        - security-headers
      priority: 50

  services:
    control-plane:
      loadBalancer:
        servers:
          - url: http://control-plane:8000
