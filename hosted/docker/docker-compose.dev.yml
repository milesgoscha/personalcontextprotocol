# Docker Compose for LOCAL DEVELOPMENT
# No TLS, uses *.localhost for wildcard routing
#
# Usage:
#   cp .env.dev.example .env
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml run --rm migrations
#
# Access:
#   Control plane: http://pcp.localhost
#   User nodes:    http://{username}.pcp.localhost
#   Traefik UI:    http://localhost:8080

services:
  # Traefik reverse proxy (dev mode - no TLS)
  # Note: v3.6+ required for Docker 29+ API compatibility
  traefik:
    image: traefik:v3.6
    container_name: pcp-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.dev.yml:/etc/traefik/traefik.yml:ro
    networks:
      - pcp-network

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: pcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-pcp_hosted}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Expose for local debugging
    networks:
      - pcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcp} -d ${POSTGRES_DB:-pcp_hosted}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Shared PCP Node (multi-tenant mode)
  pcp-node:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: pcp-node
    restart: unless-stopped
    environment:
      PCP_NODE_ID: "pcp://hosted"
      PCP_DATA_DIR: "/data"
      PCP_ALLOW_INITIAL_TOKEN: "false"
      PCP_MULTI_TENANT: "true"
    volumes:
      - pcp-node-data:/data
    networks:
      - pcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Database migrations (runs once, then exits)
  migrations:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    container_name: pcp-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pcp}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-pcp_hosted}
    command: ["alembic", "upgrade", "head"]
    networks:
      - pcp-network
    restart: "no"

  # Control Plane (waits for migrations to complete)
  control-plane:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    container_name: pcp-control-plane
    restart: unless-stopped
    user: root  # Required for Docker socket access in dev
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "8000:8000"  # Direct access for local dev
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pcp}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-pcp_hosted}

      # Auth (use fixed dev values)
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production-please}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-dev-encryption-key-32-bytes-ok}

      # Domain - uses .localhost for wildcard
      PCP_DOMAIN: ${PCP_DOMAIN:-pcp.localhost}
      PCP_IMAGE: ${PCP_IMAGE:-pcp:latest}

      # Docker socket for container management
      DOCKER_HOST: unix:///var/run/docker.sock

      # Server settings
      PCP_HOST: "0.0.0.0"
      PCP_PORT: "8000"
      DEBUG: "true"

      # Admin users (comma-separated usernames)
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}

      # Multi-tenant mode - route to shared node
      MULTI_TENANT: "true"
      SHARED_NODE_URL: "http://pcp-node:6001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - pcp-network
    labels:
      - "traefik.enable=true"
      # Main domain route
      - "traefik.http.routers.control-plane.rule=Host(`${PCP_DOMAIN:-pcp.localhost}`)"
      - "traefik.http.routers.control-plane.entrypoints=web"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8000"
      # Wildcard subdomain route (for OAuth and MCP proxying)
      - "traefik.http.routers.control-plane-subdomains.rule=HostRegexp(`^.+\\.${PCP_DOMAIN:-pcp.localhost}$$`)"
      - "traefik.http.routers.control-plane-subdomains.entrypoints=web"
      - "traefik.http.routers.control-plane-subdomains.service=control-plane"

networks:
  pcp-network:
    name: pcp-network
    driver: bridge

volumes:
  postgres-data:
  pcp-node-data:
