# Docker Compose for PCP Hosted Service (Multi-Tenant Mode)
# Includes: Traefik (reverse proxy), Control Plane, Shared PCP Node, PostgreSQL
#
# Architecture:
#   - Single shared PCP node handles all users
#   - Traefik routes *.pcp.domain → shared node with X-User-Id header
#   - Control plane manages user accounts and proxies dashboard requests
#   - No per-user Docker containers needed

services:
  # Traefik reverse proxy
  # Note: v3.6+ required for Docker 29+ API compatibility
  traefik:
    image: traefik:v3.6
    container_name: pcp-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    environment:
      - PCP_DOMAIN=${PCP_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
      - DNS_PROVIDER=${DNS_PROVIDER:-cloudflare}
      # DNS provider credentials (example for Cloudflare)
      - CF_API_EMAIL=${CF_API_EMAIL:-}
      - CF_API_KEY=${CF_API_KEY:-}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
    networks:
      - pcp-network
    labels:
      - "traefik.enable=true"

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: pcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pcp_hosted}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcp} -d ${POSTGRES_DB:-pcp_hosted}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database migrations (runs once, then exits)
  migrations:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    container_name: pcp-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pcp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pcp_hosted}
    command: ["alembic", "upgrade", "head"]
    networks:
      - pcp-network
    restart: "no"

  # Shared PCP Node (multi-tenant mode)
  # All users share this single node, scoped by X-User-Id header
  pcp-node:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: pcp-node
    restart: unless-stopped
    environment:
      # Enable multi-tenant mode
      PCP_MULTI_TENANT: "true"
      PCP_DATA_DIR: /data
      PCP_NODE_ID: pcp://shared
      PCP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Anthropic API key for reflect operation
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - pcp-shared-data:/data
    networks:
      - pcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Control Plane (waits for migrations and pcp-node to be ready)
  control-plane:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    container_name: pcp-control-plane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      pcp-node:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pcp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pcp_hosted}

      # JWT & Encryption (MUST be set in production)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY is required}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}

      # Domain configuration
      PCP_DOMAIN: ${PCP_DOMAIN:?PCP_DOMAIN is required}
      PCP_IMAGE: ${PCP_IMAGE:-pcp:latest}

      # Multi-tenant mode settings
      MULTI_TENANT: "true"
      SHARED_NODE_URL: http://pcp-node:6001

      # Server settings
      PCP_HOST: "0.0.0.0"
      PCP_PORT: "8000"
      DEBUG: ${DEBUG:-false}
    # No Docker socket needed in multi-tenant mode
    networks:
      - pcp-network
    labels:
      - "traefik.enable=true"
      # Main site (control plane dashboard)
      - "traefik.http.routers.control-plane.rule=Host(`${PCP_DOMAIN}`)"
      - "traefik.http.routers.control-plane.entrypoints=websecure"
      - "traefik.http.routers.control-plane.tls=true"
      - "traefik.http.routers.control-plane.tls.certresolver=letsencrypt"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8000"

networks:
  pcp-network:
    name: pcp-network
    driver: bridge

volumes:
  postgres-data:
  letsencrypt:
  pcp-shared-data:
