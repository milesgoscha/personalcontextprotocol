# Alembic Configuration for PCP Hosted Service

[alembic]
script_location = migrations
prepend_sys_path = .

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long table names
truncate_slug_length = 40

# Set to 'true' to run without running SQL
# revision_environment = false

# Env var for database URL (overrides sqlalchemy.url)
# Set this in your environment: DATABASE_URL=postgresql+asyncpg://...

[post_write_hooks]
# Run Black on new migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
